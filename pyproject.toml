[project]
name = "discovery"
version = "0.1.0"
description = "Runtime for discovery interviews and brief authoring"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discovery"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Вендоренные байты: правка любого символа уничтожает то, что доказывает
# copy-integrity. Форматтер сюда не заходит.
"src/discovery/contract/gate_check.py" = ["ALL"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
