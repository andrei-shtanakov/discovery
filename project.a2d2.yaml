# Maestro DAG — прогон A2/D2 (TASK-014, TASK-015), режим ecosystem-development.
#
# Второй прогон арки runtime-v1. Первый (01M0CH04 + догоняющий D1) закрыл
# TASK-001…013 и влит в master (PR #9, merge f2437ac). Здесь — то, что тогда
# было заблокировано: банк вопросов (апстрим `discovery-toolkit#4` закрыт) и
# подключение банка к CLI. TASK-016 в прогон НЕ входит: живая приёмка требует
# стейкхолдера и расширения write_scope на целевой репо — отдельный прогон,
# отдельный файл доказательств (спека §12).
#
# base_branch — интеграционная ветка пилота, не master: maestro сливает
# завершённый воркстрим в base_branch локально, поэтому человеческий гейт
# стоит на финальном PR pilot/a2-d2 -> master.
#
# На базовой ветке УЖЕ сделано руками (агент это не повторяет и не трогает):
#   4664604 — фреймы банка вендорены в src/discovery/contract/frames/ + две
#             строки в PINNED.txt (upstream недостижим из maestro-worktree);
#   0f97976 — правка §5/§7 спеки, бэклога и плана.
# Поэтому `src/discovery/contract/**` НЕ входит ни в один scope: декларация
# сама становится сторожем вендоренных байт.

project: discovery-runtime-a2-d2
description: |
  Банк вопросов стадии Need: вендоренные фреймы под обеими гарантиями копии,
  маркерный парсер с fail-closed инвариантом полноты, подключение банка к CLI
  и сквозной прогон suspend → resume → complete → гейт.
  Канонический бэклог: spec/tasks.md TASK-014…015.
  Пошаговый план с точными тестами и сигнатурами:
  docs/superpowers/plans/2026-08-18-discovery-runtime-v1.md (Task 14–15).

repo_url: https://github.com/andrei-shtanakov/discovery
repo_path: ~/labs/all_ai_orchestrators/discovery
workspace_base: ~/labs/all_ai_orchestrators/discovery-maestro-ws

max_concurrent: 1
base_branch: pilot/a2-d2
branch_prefix: "ws/"
auto_pr: false

spec_runner:
  max_retries: 2
  task_timeout_minutes: 30
  claude_model: sonnet          # фиксирован: плавающая модель делает результат неатрибутируемым
  test_command: "uv run pytest"
  run_tests_on_done: true
  lint_command: "uv run ruff check . && uv run ruff format --check ."
  run_lint_on_done: true
  extra_executor_config:        # оверлей накладывается на весь executor.config.yaml,
    executor:                   # поэтому незеркалимые поля обязаны лежать под `executor:`
      execution_mode: tdd
      tdd_runner: pytest

workstreams:
  - id: a2-bank
    title: "A2 — банк вопросов: отображение, поверхность, маркерный парсер"
    description: |
      Выполнить TASK-014 из spec/tasks.md ровно так, как расписано в
      docs/superpowers/plans/2026-08-18-discovery-runtime-v1.md (Task 14): там
      лежит готовый код парсера, тексты тестов и ожидаемый вывод каждой
      команды. НЕ придумывать альтернативную декомпозицию и не переписывать
      тесты под реализацию.

      ФРЕЙМЫ УЖЕ ЗАВЕНДОРЕНЫ. `src/discovery/contract/frames/customer.md`,
      `engineer.md` и их строки в `PINNED.txt` лежат на базовой ветке
      (коммит 4664604), проверены: consistency ok, provenance ok — байты
      идентичны upstream@ee93092f. Запускать `vendor_pull.py` против реального
      upstream НЕЛЬЗЯ: из worktree он недостижим (`../discovery-toolkit`
      резолвится рядом с worktree, а не с основным чекаутом), и попытка стоила
      арке целого прогона. Весь каталог `src/discovery/contract/` вне scope —
      если работа требует записи туда, это ошибка понимания задачи, а не
      узкая декларация.

      Задача добавляет не байты, а то, что делает их покрытыми: отображение
      `FRAMES` в `tools/vendor_pull.py` (upstream-путь → плоский
      `frames/*.md`) с созданием подкаталога назначения, расширенный
      `EXPECTED_SURFACE` в `tools/check_vendor.py` и парсер `src/discovery/bank.py`.

      Два разных объекта называются `FRAMES`, и перепутать их легко:
      `discovery.contract.gate_check.FRAMES` — таблица покрытия
      (required/optional ключи и префиксы id), её потребляет `bank.py`;
      `tools.vendor_pull.FRAMES` — отображение файлов source→dest, его
      заполняет эта задача. Импортировать одно вместо другого нельзя.

      Три вещи, которые тесты проверяют именно потому, что их легко нарушить:
      ключ покрытия читается из маркера, а НЕ угадывается по заголовку; тема
      кончается заголовком ЛЮБОГО уровня (после последней темы во фреймах идут
      `## Coverage` и `## Правила извлечения`, чьи буллеты иначе дописываются в
      неё); перенесённый буллет склеивается в один вопрос (в вендоренных
      фреймах таких 3 и 7 — иначе текст вопроса обрывается на полуслове).
      Инвариант полноты — error, а не warning: required-ключ, не заявленный ни
      одной темой, делает гейт покрытия недостижимым.

      ОЖИДАЕМЫЙ КАСКАД, не дефект твоей работы: расширение `EXPECTED_SURFACE`
      до четырёх записей красит `tests/test_check_vendor.py::test_consistency_mismatch_fails`
      — он строит синтетический `PINNED.txt` из двух записей, и `verify()`
      теперь отвергает его раньше сверки байт, с другим текстом в `detail`.
      Чинить надо синтетический манифест в тесте (дополнить до полной
      поверхности), а не `EXPECTED_SURFACE`.
      --- МЕТА-ИНСТРУКЦИЯ ГЕНЕРАТОРУ СПЕКИ (НЕ требование к продукту) ---
      Правило оформления файла `spec/maestro-tasks.md`, который ты сейчас
      пишешь. НЕ заводить его как REQ/NFR/TASK и не упоминать в требованиях:
      разрабатываемый runtime не пишет `tasks.md` вообще — это его граница
      author ≠ execute. Правило адресовано тебе как генератору, а не коду.

      Мета-строка под каждым заголовком `### TASK-NNN: …` — РОВНО вида:

          🔴 P0 | ⬜ TODO | Est: 2h

      приоритет, затем СТАТУС (TODO, IN_PROGRESS, REVIEW, DONE, BLOCKED),
      затем оценка. Без жирной разметки внутри мета-строки. `**Depends on:**`
      и `**Blocks:**` — отдельными строками ниже, НЕ внутри мета-строки.
      Проверено боем 2026-08-19: генератор выдал
      `🔴 **P0** | Est: **2h** | **Depends on:** …`, и валидатор spec-runner
      отверг файл целиком (spec-runner#301).

      В `Depends on:` ссылаться ТОЛЬКО на задачи этого же файла. Зависимости
      из канонического бэклога на задачи других воркстримов не переносить:
      валидатор отвергает файл с висячей ссылкой до запуска агента.
      --- конец мета-инструкции ---

      PRE-CHECK ПЕРЕД ЗАВЕРШЕНИЕМ ЛЮБОГО ШАГА. Каждый создаваемый или изменяемый
      Python-файл обязан пройти `uv run ruff check <file>` и
      `uv run ruff format --check <file>` при `line-length = 88` ДО завершения
      шага. Особенно это относится к `tests/test_task_NNN_red.py`: checkpoint
      замораживает его побайтово и отказывается подтверждать RED при любом
      lint/format-finding, а это фатальная ошибка без ретрая. Длинные `assert` и
      их сообщения переносить через скобки. Подавлять `# noqa` нельзя.
      Проверено боем 2026-08-19: прогон дважды встал на одной и той же строке
      собственного red-теста агента — сообщение ассерта длиной 89 символов.

    scope:
      - "src/discovery/bank.py"
      - "tools/vendor_pull.py"
      - "tools/check_vendor.py"
      - "tests/test_bank.py"
      - "tests/test_vendor_pull.py"
      - "tests/test_check_vendor.py"
      - "tests/test_vendored_copy.py"
      # TDD-режим создаёт по red-файлу на задачу — их надо объявлять, иначе
      # ex-post scope-гейт останавливает воркстрим уже после успешной работы.
      # Имя перечислено поштучно: матчер maestro (scope_gate._glob_to_regex)
      # понимает только `**`, `*` и `?`, а любой другой символ берёт буквально.
      - "tests/test_task_014_red.py"
    depends_on: []
    priority: 100

  - id: d2-flow
    title: "D2 — банк в CLI, правка §5 и сквозной прогон"
    description: |
      Выполнить TASK-015 из spec/tasks.md по плану
      docs/superpowers/plans/2026-08-18-discovery-runtime-v1.md (Task 15): там
      даны точные сигнатуры и тексты тестов, следовать им дословно.

      Две правки, а не одна. Первая: `build_source()` возвращает
      `BankQuestionSource`, пиненый коммитом из `PINNED.txt`, вместо пустого
      `StaticQuestionSource`. Вторая: `compute_lifecycle` получает предусловие
      из правки §5 — источник, не объявивший ни одного вопроса для фрейма, не
      может установить, что разговор закончен, поэтому это `unknown`, а не
      `complete`.

      Порядок проверок в `compute_lifecycle` — и есть суть правки. Пустой
      источник и исчерпанный дают одинаковый `next_question(...) is None`, и
      прочитать это столкновение как `complete` — тот самый дефект. Но
      проверка пустоты идёт ПОСЛЕ проверки pending: выданный неотвеченный
      вопрос — свидетельство в журнале, что разговор идёт, и банк не может его
      отозвать, опустев между вызовами. Предусловие получает только `complete`.
      Схлопывается ровно одна ось: `gate` считается как обычно,
      `operation.status` остаётся `ok`, `exit_code` уже проецирует
      unknown-ось в 1 и не меняется.

      ОЖИДАЕМЫЙ КАСКАД, не дефект твоей работы:
      `tests/test_cli.py::TestDefaultQuestionSource` фиксирует ровно ту
      заглушку D1, которую ты убираешь («build_source() defaults to an empty
      StaticQuestionSource», pin == "unpinned"). Тест надо переписать под новое
      поведение (банк, пин из `PINNED.txt`), а не обходить. Больше ничто в
      `tests/test_cli.py` от заглушки не зависит: остальные тесты подменяют
      `cli.build_source` своей фикстурой.

      Сквозной тест — единственное место, где арка проверяется целиком:
      start → exit 20 → status/answer до исчерпания банка → `lifecycle: complete`
      → бриф записан и прогнан через вендоренный гейт. `gate: fail` в нём
      допустим: тест утверждает, что флоу доходит до гейтованного брифа, а не
      что синтетические ответы удовлетворяют контракт.
      --- МЕТА-ИНСТРУКЦИЯ ГЕНЕРАТОРУ СПЕКИ (НЕ требование к продукту) ---
      Правило оформления файла `spec/maestro-tasks.md`, который ты сейчас
      пишешь. НЕ заводить его как REQ/NFR/TASK и не упоминать в требованиях:
      разрабатываемый runtime не пишет `tasks.md` вообще — это его граница
      author ≠ execute. Правило адресовано тебе как генератору, а не коду.

      Мета-строка под каждым заголовком `### TASK-NNN: …` — РОВНО вида:

          🔴 P0 | ⬜ TODO | Est: 2h

      приоритет, затем СТАТУС (TODO, IN_PROGRESS, REVIEW, DONE, BLOCKED),
      затем оценка. Без жирной разметки внутри мета-строки. `**Depends on:**`
      и `**Blocks:**` — отдельными строками ниже, НЕ внутри мета-строки.
      Проверено боем 2026-08-19: генератор выдал
      `🔴 **P0** | Est: **2h** | **Depends on:** …`, и валидатор spec-runner
      отверг файл целиком (spec-runner#301).

      В `Depends on:` ссылаться ТОЛЬКО на задачи этого же файла. TASK-014
      выполнен другим воркстримом и слит в базовую ветку — это содержимое
      базы, а не ребро графа: валидатор отвергает файл с висячей ссылкой до
      запуска агента.
      --- конец мета-инструкции ---

      PRE-CHECK ПЕРЕД ЗАВЕРШЕНИЕМ ЛЮБОГО ШАГА. Каждый создаваемый или изменяемый
      Python-файл обязан пройти `uv run ruff check <file>` и
      `uv run ruff format --check <file>` при `line-length = 88` ДО завершения
      шага. Особенно это относится к `tests/test_task_NNN_red.py`: checkpoint
      замораживает его побайтово и отказывается подтверждать RED при любом
      lint/format-finding, а это фатальная ошибка без ретрая. Длинные `assert` и
      их сообщения переносить через скобки. Подавлять `# noqa` нельзя.
      Проверено боем 2026-08-19: прогон дважды встал на одной и той же строке
      собственного red-теста агента — сообщение ассерта длиной 89 символов.

    scope:
      - "src/discovery/cli.py"
      - "src/discovery/lifecycle.py"
      - "tests/test_cli.py"
      - "tests/test_lifecycle.py"
      - "tests/test_end_to_end.py"
      - "tests/test_task_015_red.py"
    depends_on: [a2-bank]
    priority: 90
